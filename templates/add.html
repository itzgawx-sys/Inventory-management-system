{% extends "layout.html" %}
{% block content %}

<div class="add-container glass-panel">
    <h1>📦 Add / Update Product</h1>
    <hr style="border: 0.5px solid var(--glass-border); margin-bottom: 25px;">

    <form action="/add" method="POST" class="vertical-form">
        <div class="input-group">
            <label>Product Name</label>
            <input type="text" name="name" placeholder="Enter product name (e.g. Rice)" required>
            <small style="color: #94a3b8;">*If name exists, stock will be added to it.</small>
        </div>

        <div class="input-group">
            <label>Quantity</label>
            <input type="number" name="quantity" placeholder="Quantity to add" required>
        </div>

        <div class="form-group">
            <label>Unit Type</label>
            <select name="unit" class="form-input">
                <option value="Pcs">Pieces (Pcs)</option>
                <option value="Kg">Kilogram (Kg)</option>
                <option value="Ltr">Litre (Ltr)</option>
                <option value="Mtr">Meter (Mtr)</option>
                <option value="Box">Box</option>
            </select>
        </div>

        <div class="input-group">
            <label>Price per Unit (₹)</label>
            <input type="number" step="0.01" name="price" placeholder="Unit price" required>
        </div>

        <div class="input-group">
            <label>Location (Optional)</label>
            <input type="text" name="location" placeholder="e.g. Rack A1, Shelf 3">
        </div>

        <button type="submit" class="btn-primary">✅ Save Product</button>
    </form>
</div>

{% endblock %}
